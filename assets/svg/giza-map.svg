<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">O planalto de Gizé — mapa esquemático</title>
  <desc id="map-desc">Norte para cima. Quéops está a nordeste, Quéfren ao sudoeste de Quéops e Miquerinos mais ao sudoeste. A Esfinge e os templos do vale ficam a leste de Quéfren. Heit el-Ghurab fica ao sul e sudeste da Esfinge. A área aquática azul é interpretativa, sem margem ou porto precisos.</desc>
